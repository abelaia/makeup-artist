<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <filter id="fiber" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise" />
            <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.47  0 0 0 0.9 -0.35" result="grain" />
            <feComposite in="grain" in2="SourceGraphic" operator="in" />
        </filter>
        <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur" />
            <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="0.7" specularExponent="18" lighting-color="#fff" result="light">
                <feDistantLight azimuth="225" elevation="48" />
            </feSpecularLighting>
            <feComposite in="light" in2="SourceAlpha" operator="in" />
        </filter>
        <radialGradient id="body" cx="42%" cy="38%" r="62%">
            <stop offset="0" stop-color="#fffdfb" />
            <stop offset="0.7" stop-color="#f7f1ec" />
            <stop offset="0.93" stop-color="#ebe2db" />
            <stop offset="1" stop-color="#e2d6ce" />
        </radialGradient>
        <pattern id="quilt" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M0 0H18M0 0V18" stroke="#000" stroke-width="2.2" fill="none" />
        </pattern>
        <clipPath id="inner">
            <circle cx="100" cy="100" r="84" />
        </clipPath>
    </defs>
    <circle cx="100" cy="100" r="98" fill="url(#body)" />
    <g clip-path="url(#inner)" opacity="0.55">
        <rect width="200" height="200" fill="url(#quilt)" opacity="0.08" />
        <rect width="200" height="200" fill="url(#quilt)" filter="url(#emboss)" />
    </g>
    <circle cx="100" cy="100" r="86" fill="none" stroke="#e6dcd4" stroke-width="1.5" />
    <circle cx="100" cy="100" r="98" fill="#fff" filter="url(#fiber)" opacity="0.8" />
</svg>
